# lucidlink-filespace-dashboard configuration
# Copy to config.yaml (git-ignored) and edit. Every key is optional except the source.

title: production                       # shown in the dashboard header

filespace:
  name: production.accessionmedia        # <filespace>.<workspace>; used by the sdk source and shown in the page
  source: mount                          # mount | sdk   (mcp mode is driven by the agent, no script)
  root: /Volumes/accessionmedia/production   # mount source: where the filespace is mounted
  sdk:
    token_env: LUCIDLINK_TOKEN           # sdk source: env var holding a service-account token

# How many tokens or seconds to spend. Also selectable at run time with --budget.
#   lite      ~5 MCP calls or a 30 s walk of 3,000 entries; 7-day window; no hourly profile, no flags
#   standard  ~20 to 40 MCP calls or a 2 min walk of 40,000 entries; 7-day window; hourly profile and flags
#   deep      100+ MCP calls or a 15 min walk of 400,000 entries; 30-day window; everything
budget: standard
window_days: 7                           # overrides the budget's default audit window

# How often to regenerate. This is documentation for the agent and for you; nothing reads it yet.
#   manual  the agent regenerates when you ask (spends tokens each time)
#   script  you schedule scripts/snapshot.py and scripts/render.py (spends no tokens)
refresh: manual

folders:
  depth: 1                               # group activity by the first N path segments
  exclude: []                            # extra names to skip during the walk (audit dir and dotfiles are always skipped)

actors:
  # Regexes that mark an audit user as a service account (agent or automation) rather than a human.
  # Default: any user name without an @ sign.
  service_patterns: ["^(?!.*@)"]
  labels: {}                             # optional friendly names, e.g. "sa-render-01": "Render farm"

cold:
  candidate_min_bytes: 10485760          # 10 MB
  candidate_min_age_days: 180

output:
  dir: ./out                             # where snapshot.json and index.html land locally
  publish_to: /Volumes/accessionmedia/production/Dashboards/production   # optional: copy into the filespace so the whole team sees it
  keep_history: true                     # append dated snapshots under <publish_to>/history/
